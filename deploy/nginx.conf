# nginx sits in front of everything and decides where each request goes.
# Visitors only ever talk to nginx; Django is not reachable from the internet.

upstream django {
    # The full container name, NOT the short service name "web".
    #
    # This container is attached to the shared cinevault network so Caddy can
    # reach it, and cinevault also has a service called "web". Asking Docker's
    # DNS for "web" is therefore ambiguous and can silently reach the wrong app,
    # which returns 400 for our hostname. Container names are unique per host.
    #
    # The name is <compose project>-<service>-<number>; the project name is
    # pinned by "name: shopinventory" at the top of docker-compose.yml.
    server shopinventory-web-1:8000;
}

# Caddy sits in front of this nginx and terminates https, then forwards plain
# http. It tells us the visitor's real scheme in X-Forwarded-Proto. Without this
# map we would overwrite that header with our own "http" and Django would think
# the connection was insecure - causing an endless redirect loop.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;  # trust what the proxy in front told us
    ''      $scheme;                  # no proxy in front: use our own scheme
}

server {
    listen 80;
    server_name _;

    # Phone photos are big. Without this, uploads over 1MB fail with "413".
    client_max_body_size 20M;

    # Compress text responses; typically cuts JavaScript transfer by ~70%.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Do not advertise the exact nginx version to attackers.
    server_tokens off;

    # Let's Encrypt proves you own the domain by fetching a file from this path.
    # It must stay reachable over plain http, even after https is switched on.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ---- Uploaded product pictures ----
    # Served straight from disk by nginx. Django never wakes up for these.
    location /media/ {
        add_header X-Content-Type-Options "nosniff" always;
        alias /var/www/media/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ---- Everything Django owns ----
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://django;
        proxy_http_version 1.1;

        # Django needs these to know who the real visitor was, since from its
        # point of view every request arrives from nginx.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # Excel and PDF exports can take a while to generate.
        proxy_read_timeout 120s;
        proxy_redirect off;
    }

    # ---- The React app ----
    root /usr/share/nginx/html;
    index index.html;

    # Vite stamps a content hash into these filenames, so they can be cached
    # forever: a new build produces new names.
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # A single-page app handles its own routing. If someone reloads on /sales,
    # no such file exists, so hand back index.html and let React sort it out.
    location / {
        # nginx drops server-level add_header lines in any location that has its own, so
        # security headers are repeated per location. The API gets them from Django instead.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        try_files $uri $uri/ /index.html;
    }
}
