# One file describing the whole system. `docker compose up` starts all of it.
# Values written as ${NAME} are read from the .env file sitting next to this file.
name: shopinventory

services:
  # ---------------- PostgreSQL ----------------
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Named volume = storage that survives when the container is deleted.
      # Without this, every restart would wipe your entire shop database.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Postgres takes a few seconds to accept connections. This command reports
      # when it is truly ready, so Django does not start too early and crash.
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    # No "ports:" on purpose - the database is reachable only from the other
    # containers, never from the internet.

  # ---------------- Django + gunicorn ----------------
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Assembled from the pieces above so the password is written in one place only.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DJANGO_MEDIA_ROOT: /app/media
    volumes:
      # Uploaded pictures must outlive the container too.
      - media:/app/media
    depends_on:
      db:
        # Wait for the healthcheck above to pass, not merely for the container to exist.
        condition: service_healthy
    expose:
      - '8000' # visible to nginx inside the private network, not to the outside

  # ---------------- nginx + the React app ----------------
  nginx:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      # "host:container" - the only doors open to the internet.
      - '80:80'
      - '443:443'
    volumes:
      # Mounted rather than baked in, so editing the config needs a restart, not a rebuild.
      # Swap nginx.conf for nginx-tls.conf once certificates exist.
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/var/www/media:ro # read-only: nginx serves pictures, never writes them
      - certbot-www:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      - web

  # ---------------- Let's Encrypt certificates ----------------
  # "profiles" keeps this out of `docker compose up`. You run it by hand:
  #   docker compose run --rm certbot certonly --webroot -w /var/www/certbot -d your-domain.com
  certbot:
    image: certbot/certbot:latest
    profiles: ['certbot']
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt

volumes:
  pgdata:
  media:
  certbot-www:
  certbot-certs:
