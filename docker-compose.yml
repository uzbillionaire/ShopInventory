# One file describing the whole system. `docker compose up` starts all of it.
# Values written as ${NAME} are read from the .env file sitting next to this file.
name: shopinventory

services:
  # ---------------- PostgreSQL ----------------
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Named volume = storage that survives when the container is deleted.
      # Without this, every restart would wipe your entire shop database.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Postgres takes a few seconds to accept connections. This command reports
      # when it is truly ready, so Django does not start too early and crash.
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    # No "ports:" on purpose - the database is reachable only from the other
    # containers, never from the internet.

  # ---------------- Django + gunicorn ----------------
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Assembled from the pieces above so the password is written in one place only.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DJANGO_MEDIA_ROOT: /app/media
    volumes:
      # Uploaded pictures must outlive the container too.
      - media:/app/media
    depends_on:
      db:
        # Wait for the healthcheck above to pass, not merely for the container to exist.
        condition: service_healthy
    expose:
      - '8000' # visible to nginx inside the private network, not to the outside

  # ---------------- nginx + the React app ----------------
  # Deliberately NOT called "nginx": this container joins a network shared with
  # the cinevault project, which already has a service by that name and finds it
  # via DNS. Two containers answering to "nginx" would break both apps at random.
  shopproxy:
    build:
      context: ./frontend
    restart: unless-stopped
    # No "ports:" here. Caddy already owns 80 and 443 on this server and acts as
    # the public doorman; publishing them again would fail with "port is already
    # allocated". We only expose port 80 to other containers on the shared network.
    expose:
      - '80'
    networks:
      default: {} # private network with web and db
      edge:
        aliases:
          # The name Caddy will use in its reverse_proxy line.
          - shopinventory-nginx
    volumes:
      # Mounted rather than baked in, so editing the config needs a restart, not a rebuild.
      # Swap nginx.conf for nginx-tls.conf once certificates exist.
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/var/www/media:ro # read-only: nginx serves pictures, never writes them
      - certbot-www:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      - web

  # ---------------- Let's Encrypt certificates ----------------
  # NOT NEEDED on a server where Caddy is the public proxy: Caddy obtains and
  # renews certificates by itself. This is kept only for the case where this app
  # is the sole thing on a server and nginx faces the internet directly.
  # "profiles" keeps it out of `docker compose up`; it never runs unless asked.
  certbot:
    image: certbot/certbot:latest
    profiles: ['certbot']
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt

networks:
  # Created by this project: db, web and nginx talk to each other privately here.
  default:
  # "external: true" means Docker must NOT create this - it already exists,
  # made by the cinevault project. Joining it lets Caddy reach our nginx by name.
  # Confirm the exact name with:  docker inspect cinevault-caddy-1 \
  #   --format '{{range $$k,$$v := .NetworkSettings.Networks}}{{$$k}} {{end}}'
  edge:
    external: true
    name: ${EDGE_NETWORK:-cinevault_default}

volumes:
  pgdata:
  media:
  certbot-www:
  certbot-certs:
